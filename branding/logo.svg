<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- LibreVDI logo: a screen (virtual desktop) with an open "L" that reaches out of the frame.
       Licensed like the project (BSD-3-Clause). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- monitor -->
  <rect x="44" y="58" width="168" height="112" rx="14" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M104 196 H152" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <path d="M128 170 V196" stroke="#FFFFFF" stroke-width="14"/>
  <!-- open "L" inside the screen -->
  <path d="M96 84 V140 H160" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="90" r="10" fill="#FDE68A"/>
</svg>
