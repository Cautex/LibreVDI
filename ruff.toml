# Lint config for LibreVDI's own Python code (upstream code is not linted here)
line-length = 120
target-version = "py312"
extend-exclude = ["upstream"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests

[lint.per-file-ignores]
# settings overlay injects names from the upstream sample at runtime
"docker/broker/settings.py" = ["F821", "E402"]
