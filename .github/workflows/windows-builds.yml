name: Windows builds (agent + client)

# Builds the upstream OpenUDS 5.0 actor (agent) and launcher (client) for Windows, branded as
# LibreVDI, and packages them as NSIS installers with third-party license notices.
# Also called by release.yml with the release version.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "upstream/uds-actor"
      - "upstream/uds-client"
      - "packaging/windows/**"
      - "branding/**"
      - ".github/workflows/windows-builds.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Installer version (default: 0.1.0-dev.<run number>)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # long first builds (FreeRDP, FFmpeg): queue new runs instead of cancelling them
  cancel-in-progress: false

jobs:
  agent:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Version
        shell: pwsh
        run: packaging\windows\set-version.ps1 "${{ inputs.version }}" ${{ github.run_number }}
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/uds-actor
      - name: Apply LibreVDI branding (agent sources, icons)
        run: |
          python -m pip install --quiet polib pillow
          python packaging/windows/brand_upstream.py agent upstream/uds-actor branding
      - name: Build agent (release)
        working-directory: upstream/uds-actor
        env:
          # static MSVC runtime: no VCRUNTIME140.dll needed on fresh Windows installs
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem upstream/uds-actor/target/release/*.exe | Copy-Item -Destination out
          Get-ChildItem out | Format-Table Name, Length
      - name: Check DLL dependencies (must only need Windows system DLLs)
        shell: pwsh
        run: packaging\windows\check-dependencies.ps1 out
      - name: Third-party license notices
        run: >-
          python packaging/windows/collect_licenses.py --title "LibreVDI Agent"
          --cargo-dir upstream/uds-actor
          --fallback-text BSD-3-Clause=upstream/uds-actor/LICENSE
          --out notices/THIRD-PARTY-NOTICES.txt --summary notices/third-party-agent.md
      - name: NSIS (cached, Chocolatey with retries)
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-${{ runner.os }}-v1
      - name: Install NSIS
        shell: pwsh
        run: packaging\windows\install-nsis.ps1
      - name: Build installers (NSIS)
        shell: pwsh
        run: |
          $notices = Resolve-Path notices\THIRD-PARTY-NOTICES.txt
          foreach ($variant in @("unmanaged", "managed")) {
            makensis /V2 /INPUTCHARSET UTF8 /DVERSION=$env:LIBREVDI_VERSION /DVIVERSION=$env:LIBREVDI_VIVERSION `
              /DVARIANT=$variant "/DNOTICES=$notices" packaging\windows\agent.nsi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Move-Item packaging\windows\LibreVDI-Agent-*-Setup-*.exe out\
          Copy-Item notices\THIRD-PARTY-NOTICES.txt out\THIRD-PARTY-NOTICES-Agent.txt
          Copy-Item notices\third-party-agent.md out\
          Get-ChildItem out | Format-Table Name, Length
      - name: Test silent installation (install, configuration, uninstall)
        shell: pwsh
        run: packaging\windows\test-silent-install.ps1 out
      - uses: actions/upload-artifact@v4
        with:
          name: librevdi-agent-windows-x64
          path: |
            out/*.exe
            out/*.txt
            out/*.md
          retention-days: 14

  client:
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      VCPKG_ROOT: C:\vcpkg
      FREERDP_ROOT: C:\dev\freerdp
      FREERDP_VERSION: "3.26.0"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # audiopus_sys bundles an old opus CMakeLists.txt; CMake >= 4 refuses it otherwise
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # self-contained Rust binaries; makes vcpkg-rs pick the static libvpx triplet
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Version
        shell: pwsh
        run: packaging\windows\set-version.ps1 "${{ inputs.version }}" ${{ github.run_number }}
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore native dependencies (vcpkg + FreeRDP)
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\dev\freerdp
            C:\dev\lgpl-sources
          key: client-deps-${{ runner.os }}-freerdp-3.26.0-${{ hashFiles('packaging/windows/build-client-deps.ps1') }}
      - name: Build native dependencies
        shell: pwsh
        run: packaging\windows\build-client-deps.ps1
      # Save right away (not only on job success): the first build takes about an hour
      - name: Save native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\dev\freerdp
            C:\dev\lgpl-sources
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/uds-client
      - name: Apply LibreVDI branding (client sources, icons, translations)
        run: |
          python -m pip install --quiet polib pillow
          python packaging/windows/brand_upstream.py client upstream/uds-client branding
      - name: Build client launcher (release)
        working-directory: upstream/uds-client
        run: cargo build --release --locked -p launcher
      - name: Collect binaries and runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem upstream/uds-client/target/release/*.exe | Copy-Item -Destination out
          Get-ChildItem "$env:FREERDP_ROOT\bin\*.dll" | Copy-Item -Destination out
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" | Copy-Item -Destination out
          # App-local Visual C++ runtime (redistributable files) for FreeRDP/FFmpeg DLLs built with /MD
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Write-Host "VC runtime from $($crt.FullName)"
          Get-ChildItem "$($crt.FullName)\*.dll" | Copy-Item -Destination out
          Get-ChildItem out | Format-Table Name, Length
      - name: Check DLL dependencies (everything not shipped must be a Windows system DLL)
        shell: pwsh
        run: packaging\windows\check-dependencies.ps1 out
      - name: Third-party license notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force notices | Out-Null
          # FreeRDP is built from source (cached); its license text comes from the same tag
          curl.exe -fsSL -o notices\FreeRDP-LICENSE.txt "https://raw.githubusercontent.com/FreeRDP/FreeRDP/$env:FREERDP_VERSION/LICENSE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/collect_licenses.py --title "LibreVDI Client" `
            --cargo-dir upstream/uds-client --root launcher `
            --fallback-text BSD-3-Clause=upstream/uds-client/LICENSE `
            --vcpkg-installed "$env:VCPKG_ROOT\installed" --vcpkg-port "*" `
            --extra "FreeRDP $env:FREERDP_VERSION|Apache-2.0|notices\FreeRDP-LICENSE.txt" `
            --extra "Microsoft Visual C++ Runtime|Microsoft Visual Studio Distributable Code|packaging\windows\notices\msvc-runtime.txt" `
            --out notices\THIRD-PARTY-NOTICES.txt --summary notices\third-party-client.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: NSIS (cached, Chocolatey with retries)
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-${{ runner.os }}-v1
      - name: Install NSIS
        shell: pwsh
        run: packaging\windows\install-nsis.ps1
      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $notices = Resolve-Path notices\THIRD-PARTY-NOTICES.txt
          makensis /V2 /INPUTCHARSET UTF8 /DVERSION=$env:LIBREVDI_VERSION /DVIVERSION=$env:LIBREVDI_VIVERSION `
            "/DNOTICES=$notices" packaging\windows\client.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging\windows\LibreVDI-Client-Setup-*.exe out\
          Copy-Item notices\THIRD-PARTY-NOTICES.txt out\THIRD-PARTY-NOTICES-Client.txt
          # corresponding source of the LGPL libraries (FFmpeg, libusb) shipped as DLLs
          Compress-Archive -Path C:\dev\lgpl-sources\* -DestinationPath "out\LibreVDI-Client-LGPL-sources-$env:LIBREVDI_VERSION.zip"
          Copy-Item notices\third-party-client.md out\
      - uses: actions/upload-artifact@v4
        with:
          name: librevdi-client-windows-x64
          path: out/*
          retention-days: 14
