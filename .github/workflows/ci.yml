name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # installer scripts include upstream license files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff shellcheck-py
      - name: ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: shellcheck
        run: shellcheck docker/broker/entrypoint.sh docker/broker/scripts/with-extra-ca.sh docker/tunnel/entrypoint.sh tests/smoke.sh tests/load.sh tests/tunnel.sh tests/nsis-compile.sh tools/fetch-windows-builds.sh packaging/linux/*.sh packaging/linux/librevdi-agent-configure
      - name: Windows installer scripts compile (NSIS)
        run: |
          sudo apt-get install -y -qq nsis >/dev/null
          tests/nsis-compile.sh
      - name: compose file
        run: |
          cp .env.example .env
          docker compose config -q

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest cryptography polib
      - name: Unit tests (LibreVDI extensions)
        run: python -m pytest -q tests/unit

  image-and-smoke:
    runs-on: ubuntu-24.04
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Build broker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/broker/Dockerfile
          tags: librevdi-broker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build tunnel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tunnel/Dockerfile
          tags: librevdi-tunnel:ci
          load: true
          cache-from: type=gha,scope=tunnel
          cache-to: type=gha,mode=max,scope=tunnel
      - name: Prepare .env with throw-away secrets
        run: |
          cp .env.example .env
          sed -i "s/CHANGE_ME_DB_PASSWORD/$(openssl rand -hex 16)/; s/CHANGE_ME_ADMIN_PASSWORD/$(openssl rand -hex 12)/" .env
          {
            echo "LIBREVDI_BROKER_IMAGE=librevdi-broker:ci"
            echo "LIBREVDI_TUNNEL_IMAGE=librevdi-tunnel:ci"
            echo "LIBREVDI_HTTP_PORT=8080"
            echo "LIBREVDI_HTTPS_PORT=8443"
          } >> .env
      - name: Start stack
        run: docker compose up -d --no-build
      - name: Smoke test
        run: tests/smoke.sh
      - name: Load test (DB connection handling)
        run: tests/load.sh 30
      - name: Tunnel (profile) – registration and listener
        run: |
          docker compose --profile tunnel up -d --no-build
          tests/tunnel.sh
      - name: Restart (idempotent init) and smoke test again
        run: |
          docker compose --profile tunnel down
          docker compose --profile tunnel up -d --no-build
          tests/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --profile tunnel down -v
