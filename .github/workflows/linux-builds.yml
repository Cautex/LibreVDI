name: Linux builds (agent + client)

# Builds the upstream OpenUDS 5.0 launcher (client) and actor (agent) for the supported Linux
# desktops - Ubuntu 24.04 / 26.04 (.deb) and Rocky Linux 9 / 10 (.rpm) - with builders derived
# from the upstream Debian 13 builder, packages them as LibreVDI and tests the installation in a
# clean container of each distribution. Native packages per distribution (glibc and FFmpeg differ).
# Also called by release.yml with the release version.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "upstream/uds-actor"
      - "upstream/uds-client"
      - "packaging/linux/**"
      - "packaging/windows/brand_upstream.py"
      - "packaging/windows/collect_licenses.py"
      - "branding/**"
      - ".github/workflows/linux-builds.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Package version (default: 0.1.0-dev.<run number>)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}  # own group when called by release.yml
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.component }} ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component: [client, agent]
        distro: [Ubuntu2404, Ubuntu2604, Rocky9, Rocky10]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="0.1.0-dev.${{ github.run_number }}"
          echo "LIBREVDI_VERSION=$version" >> "$GITHUB_ENV"
          echo "version $version"
      - name: Apply LibreVDI branding (sources, icons, translations)
        run: |
          python3 -m pip install --quiet --break-system-packages polib pillow
          crate=upstream/uds-${{ matrix.component == 'client' && 'client' || 'actor' }}
          python3 packaging/windows/brand_upstream.py ${{ matrix.component }} "$crate" branding
      - name: Third-party license notices
        run: |
          mkdir -p notices
          args=(--title "LibreVDI ${{ matrix.component == 'client' && 'Client' || 'Agent' }} (Linux)"
                --target x86_64-unknown-linux-gnu --out notices/THIRD-PARTY-NOTICES.txt)
          if [ "${{ matrix.component }}" = client ]; then
            # FreeRDP is built from source in the builder image and shipped next to the launcher
            freerdp=$(sed -n 's|.*git clone --branch \([0-9.]*\) .*FreeRDP.*|\1|p' \
              upstream/uds-client/building/linux/builders/Debian13/Dockerfile)
            curl -fsSL -o notices/FreeRDP-LICENSE.txt "https://raw.githubusercontent.com/FreeRDP/FreeRDP/$freerdp/LICENSE"
            args+=(--cargo-dir upstream/uds-client --root launcher
                   --fallback-text BSD-3-Clause=upstream/uds-client/LICENSE
                   --extra "FreeRDP $freerdp|Apache-2.0|notices/FreeRDP-LICENSE.txt")
            if [ "${{ matrix.distro }}" = Rocky9 ]; then
              # static libvpx in the launcher (packaging/linux/make_builder.py)
              vpx=$(python3 -c 'import sys; sys.path.insert(0, "packaging/linux"); import make_builder; print(make_builder.LIBVPX_VERSION)')
              curl -fsSL "https://chromium.googlesource.com/webm/libvpx/+/refs/tags/v$vpx/LICENSE?format=TEXT" | base64 -d > notices/libvpx-LICENSE.txt
              args+=(--extra "libvpx $vpx|BSD-3-Clause|notices/libvpx-LICENSE.txt")
            fi
          else
            args+=(--cargo-dir upstream/uds-actor --fallback-text BSD-3-Clause=upstream/uds-actor/LICENSE)
          fi
          python3 packaging/windows/collect_licenses.py "${args[@]}"
          echo "NOTICES=$PWD/notices/THIRD-PARTY-NOTICES.txt" >> "$GITHUB_ENV"
      - name: Prepare builder
        id: builder
        run: |
          dir=$(packaging/linux/prepare-builder.sh ${{ matrix.component }} ${{ matrix.distro }})
          prefix=${{ matrix.component == 'client' && 'udslauncher' || 'udsactor' }}
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "image=rust-builder-$prefix:${{ matrix.distro }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # builder images (the client one compiles FreeRDP) with a layer cache between runs
      - name: Builder image (cached)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"  # no extra .dockerbuild artifacts next to the packages
        with:
          context: ${{ steps.builder.outputs.dir }}
          tags: ${{ steps.builder.outputs.image }}
          load: true
          cache-from: type=gha,scope=linux-${{ matrix.component }}-${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.component }}-${{ matrix.distro }}
      - name: Mark builder image as current (no rebuild by rustbuilder.py)
        run: touch "${{ steps.builder.outputs.dir }}/build.stamp"
      - name: Build and rebrand packages
        run: packaging/linux/build-linux.sh ${{ matrix.component }} ${{ matrix.distro }} "$LIBREVDI_VERSION" out
      - name: Test installation in a clean ${{ matrix.distro }} container
        run: packaging/linux/test-install.sh ${{ matrix.distro }} out
      - uses: actions/upload-artifact@v4
        with:
          name: librevdi-${{ matrix.component }}-linux-${{ matrix.distro }}
          path: |
            out/*.deb
            out/*.rpm
          retention-days: 14
